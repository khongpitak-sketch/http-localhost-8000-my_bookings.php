<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3c6d"/>
      <stop offset="55%" stop-color="#16508b"/>
      <stop offset="100%" stop-color="#072747"/>
    </linearGradient>
    <linearGradient id="iosGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#9a7413"/>
    </linearGradient>
    <linearGradient id="iosVan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="iosGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
  </defs>

  <!-- Opaque Full-Bleed Canvas for iOS Home Screen Icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#iosBg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#iosGold)" stroke-width="5" opacity="0.8"/>
  <circle cx="256" cy="240" r="185" fill="#1e5799" opacity="0.22"/>

  <!-- Top Header Badge: FMS PNU -->
  <rect x="136" y="54" width="240" height="46" rx="23" fill="url(#iosGold)"/>
  <text x="256" y="85" font-family="'Prompt', 'Sarabun', sans-serif" font-size="25" font-weight="800" fill="#072747" text-anchor="middle" letter-spacing="1.5">FMS • PNU</text>

  <!-- Executive Van Vector Graphic -->
  <g transform="translate(0, 12)">
    <ellipse cx="256" cy="348" rx="168" ry="14" fill="#04182e" opacity="0.55"/>
    <path d="M84,268 L84,205 C84,183 102,165 124,165 L320,165 C348,165 368,176 384,202 L416,248 C425,260 428,272 428,286 L428,312 C428,324 418,332 406,332 L106,332 C94,332 84,322 84,310 Z" fill="url(#iosVan)"/>
    <path d="M84,274 L426,274 L428,288 L84,288 Z" fill="url(#iosGold)"/>
    <rect x="140" y="153" width="160" height="8" rx="4" fill="url(#iosGold)"/>
    <rect x="104" y="182" width="76" height="62" rx="10" fill="url(#iosGlass)"/>
    <rect x="192" y="182" width="84" height="62" rx="10" fill="url(#iosGlass)"/>
    <path d="M290,182 L338,182 C354,182 366,190 378,208 L398,238 C401,242 398,244 392,244 L290,244 Z" fill="url(#iosGlass)"/>
    <path d="M404,256 L426,256 L428,272 L404,272 C399,272 396,268 396,264 C396,260 399,256 404,256 Z" fill="#38bdf8"/>
    <rect x="84" y="250" width="12" height="24" rx="4" fill="#ef4444"/>
    <circle cx="158" cy="328" r="38" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <circle cx="158" cy="328" r="22" fill="url(#iosGold)"/>
    <circle cx="158" cy="328" r="9" fill="#0f172a"/>
    <circle cx="350" cy="328" r="38" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <circle cx="350" cy="328" r="22" fill="url(#iosGold)"/>
    <circle cx="350" cy="328" r="9" fill="#0f172a"/>
    <circle cx="240" cy="280" r="22" fill="#0b3c6d" stroke="url(#iosGold)" stroke-width="3.5"/>
    <path d="M230,280 L237,287 L252,272" fill="none" stroke="#f5d77f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Label -->
  <rect x="96" y="404" width="320" height="44" rx="22" fill="#072747" stroke="url(#iosGold)" stroke-width="2"/>
  <text x="256" y="433" font-family="'Prompt', 'Sarabun', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">ระบบขออนุญาตใช้รถยนต์</text>
</svg>
