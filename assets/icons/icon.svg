<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3c6d"/>
      <stop offset="55%" stop-color="#16508b"/>
      <stop offset="100%" stop-color="#072747"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#9a7413"/>
    </linearGradient>
    <linearGradient id="vanBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Glow & Gold Frame -->
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.85"/>
  <circle cx="256" cy="240" r="190" fill="#1e5799" opacity="0.22"/>

  <!-- Top Header Badge: FMS PNU -->
  <g filter="url(#dropShadow)">
    <rect x="136" y="54" width="240" height="46" rx="23" fill="url(#goldGrad)"/>
    <text x="256" y="85" font-family="'Prompt', 'Sarabun', sans-serif" font-size="25" font-weight="800" fill="#072747" text-anchor="middle" letter-spacing="1.5">FMS • PNU</text>
  </g>

  <!-- Executive Van Side/Front-3/4 Vector Graphic -->
  <g filter="url(#dropShadow)" transform="translate(0, 12)">
    <!-- Road / Ground Shadow -->
    <ellipse cx="256" cy="348" rx="168" ry="14" fill="#04182e" opacity="0.55"/>

    <!-- Van Main Body -->
    <path d="M84,268 L84,205 C84,183 102,165 124,165 L320,165 C348,165 368,176 384,202 L416,248 C425,260 428,272 428,286 L428,312 C428,324 418,332 406,332 L106,332 C94,332 84,322 84,310 Z" fill="url(#vanBody)"/>

    <!-- Gold Decorative Stripe along the Van Side -->
    <path d="M84,274 L426,274 L428,288 L84,288 Z" fill="url(#goldGrad)"/>

    <!-- Roof Rack / Official Crown Bar -->
    <rect x="140" y="153" width="160" height="8" rx="4" fill="url(#goldGrad)"/>

    <!-- Passenger Windows (Left & Middle) -->
    <rect x="104" y="182" width="76" height="62" rx="10" fill="url(#glassGrad)"/>
    <rect x="192" y="182" width="84" height="62" rx="10" fill="url(#glassGrad)"/>

    <!-- Front Cabin Window & Windshield -->
    <path d="M290,182 L338,182 C354,182 366,190 378,208 L398,238 C401,242 398,244 392,244 L290,244 Z" fill="url(#glassGrad)"/>

    <!-- Window Highlight Reflections -->
    <path d="M114,188 L134,188 L118,238 L108,238 Z" fill="#ffffff" opacity="0.18"/>
    <path d="M204,188 L226,188 L210,238 L198,238 Z" fill="#ffffff" opacity="0.18"/>
    <path d="M304,188 L328,188 L312,238 L298,238 Z" fill="#ffffff" opacity="0.22"/>

    <!-- Front Headlight -->
    <path d="M404,256 L426,256 L428,272 L404,272 C399,272 396,268 396,264 C396,260 399,256 404,256 Z" fill="#38bdf8"/>
    <path d="M408,259 L425,259 L426,269 L408,269 Z" fill="#e0f2fe"/>

    <!-- Rear Taillight -->
    <rect x="84" y="250" width="12" height="24" rx="4" fill="#ef4444"/>

    <!-- Door Handle Accents -->
    <rect x="252" y="256" width="18" height="5" rx="2.5" fill="#64748b"/>
    <rect x="300" y="256" width="18" height="5" rx="2.5" fill="#64748b"/>

    <!-- Front Bumper Accent -->
    <path d="M398,308 L428,308 L428,322 C428,328 423,332 416,332 L398,332 Z" fill="#94a3b8"/>

    <!-- Left Wheel -->
    <circle cx="158" cy="328" r="38" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <circle cx="158" cy="328" r="22" fill="url(#goldGrad)"/>
    <circle cx="158" cy="328" r="9" fill="#0f172a"/>

    <!-- Right Wheel -->
    <circle cx="350" cy="328" r="38" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <circle cx="350" cy="328" r="22" fill="url(#goldGrad)"/>
    <circle cx="350" cy="328" r="9" fill="#0f172a"/>

    <!-- Checkmark / Approved Shield Badge on Van -->
    <circle cx="240" cy="280" r="22" fill="#0b3c6d" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <path d="M230,280 L237,287 L252,272" fill="none" stroke="#f5d77f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Thai Title Label -->
  <rect x="96" y="404" width="320" height="44" rx="22" fill="#072747" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="256" y="433" font-family="'Prompt', 'Sarabun', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">ระบบขออนุญาตใช้รถยนต์</text>
</svg>
